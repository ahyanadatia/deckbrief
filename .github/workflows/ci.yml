name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy src
      - name: Tests
        run: pytest
      - name: Eval skeleton (offline)
        run: deckbrief eval

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t deckbrief:ci .
      - name: Smoke test
        run: |
          docker run -d --name db -p 8000:8000 deckbrief:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/api/health && exit 0; sleep 1; done
          docker logs db; exit 1
